services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agrovison-backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      # The current Flask app has no dedicated health endpoint; check that
      # the process is listening without changing application routes.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/districts', timeout=5)\""]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: agrovison-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
